<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Public-Company Research</title>
<style>
*{box-sizing:border-box}body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f4f5f7;color:#202735}
main{max-width:1200px;margin:32px auto;padding:0 24px}h1{font-size:28px;margin-bottom:4px}p{margin-top:0;color:#4c5768}
form,.panel{background:white;border:1px solid #d6dbe3;border-radius:8px;padding:20px;margin:18px 0}
label{display:block;font-weight:600;margin-bottom:8px}select,textarea,button{font:inherit;padding:8px;border:1px solid #aab3c0;border-radius:4px}
textarea{display:block;width:100%;min-height:90px;resize:vertical}select{width:100%}.filters{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:16px}
button{cursor:pointer;background:#174a8b;color:white;margin-top:12px}button:disabled{opacity:.5;cursor:default}#stop{background:white;color:#174a8b}
.layout{display:grid;grid-template-columns:3fr 2fr;gap:20px}.panel{margin-top:0;min-width:0}h2{font-size:18px;margin-top:0}
pre,#answer{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}#status{margin-left:12px;font-size:14px}details{margin:12px 0}a{color:#174a8b}
.source{display:block;background:#edf3fb;color:#174a8b;text-align:left;width:100%;margin:8px 0}.error{color:#a62323}
mark{background:#fff2ac}#passage{max-height:600px;overflow:auto}#passage pre{font:13px/1.5 monospace}#trace{font:13px/1.5 monospace;max-height:300px;overflow:auto}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
</style></head><body><main>
<h1>Public-Company Research</h1><p>Research the collected filings and earnings releases. Each question uses the selected companies and fiscal years.</p>
<form id="research"><div class="filters"><div><label for="company">Companies (Ctrl/Cmd to select several)</label>
<select id="company" multiple size="4"><option value="NVDA" selected>NVIDIA</option><option value="AMD">AMD</option><option value="INTC">Intel</option><option value="QCOM">Qualcomm</option></select></div>
<div><label for="year">Fiscal years</label><select id="year" multiple size="3"></select><small id="coverage"></small></div></div>
<label for="question">Research question</label><textarea id="question" required minlength="3" maxlength="2000">What drove NVIDIA's revenue growth in FY2026?</textarea>
<button id="ask" type="submit">Research</button> <button id="stop" type="button" disabled>Stop</button><span id="status" role="status">Ready</span></form>
<div class="layout"><section class="panel"><h2>Answer</h2><div id="answer" aria-live="polite"></div><div id="sources"></div>
<details><summary>Routing and tool trace</summary><pre id="trace"></pre></details></section>
<aside class="panel"><h2>Source passage</h2><p id="source-label">Select a citation to inspect its exact passage.</p><div id="passage"></div></aside></div>
</main><script>
const $=id=>document.getElementById(id);let coverage={},controller;
const selected=id=>Array.from($(id).selectedOptions,o=>o.value);
function years(){const companies=selected('company'),available=[...new Set(companies.flatMap(c=>coverage[c]||[]))].sort();
 $('year').replaceChildren(...available.map(y=>{const o=document.createElement('option');o.value=y;o.textContent='FY'+y;o.selected=y===available.at(-1);return o}));
 $('coverage').textContent=companies.map(c=>c+': '+(coverage[c]||[]).map(y=>'FY'+y).join(', ')).join(' · ')}
fetch('/api/coverage').then(r=>r.json()).then(data=>{coverage=data;years()}).catch(()=>{$('status').textContent='Coverage unavailable'});
$('company').addEventListener('change',years);
async function inspect(source){const r=await fetch(source.inspection_url);if(!r.ok){$('source-label').textContent='Passage unavailable; rebuild the index if sources changed.';return}
 const p=await r.json();$('source-label').replaceChildren(document.createTextNode(`${p.company} · FY${p.fiscal_year} · ${p.form} · ${p.period_end} · ${p.version} · ${p.section}${p.page?' · page '+p.page:''} `));
 for(const [label,url] of [['SEC filing',p.canonical_url],['Official retrieval source',p.retrieval_url],['Collected original',p.original_url]]){const link=document.createElement('a');link.href=url;link.textContent=label;link.target='_blank';link.rel='noopener noreferrer';$('source-label').append(link,document.createTextNode(' · '))}
 if(p.risk_context_note)$('source-label').append(document.createTextNode(p.risk_context_note));
 const pre=document.createElement('pre'),mark=document.createElement('mark'),start=p.start-p.context_start;mark.textContent=p.text;
 pre.append(document.createTextNode(p.context.slice(0,start)),mark,document.createTextNode(p.context.slice(start+p.text.length)));$('passage').replaceChildren(pre)}
function displaySources(sources){$('sources').replaceChildren(...sources.map(s=>{const b=document.createElement('button');b.type='button';b.className='source';
 b.textContent=`[${s.source_id}] ${s.company} FY${s.fiscal_year} ${s.form} (${s.version}) · ${s.section}`;b.onclick=()=>inspect(s);return b}));
 const text=$('answer').textContent,parts=text.split(/(\[S\d+\])/);$('answer').replaceChildren(...parts.map(part=>{const source=sources.find(s=>'['+s.source_id+']'===part);if(!source)return document.createTextNode(part);const a=document.createElement('a');a.href=source.inspection_url;a.textContent=part;a.onclick=e=>{e.preventDefault();inspect(source)};return a}))}
function event(type,data){if(type==='token')$('answer').append(document.createTextNode(data));
 else if(type==='sources')displaySources(data);
 else if(type==='error'){$('status').textContent=data;$('status').className='error';$('trace').textContent+=JSON.stringify({event:type,data},null,2)+'\n'}
 else if(type==='complete'){if(data.status!=='failed')$('status').textContent=data.status==='completed'?'Complete · citations verified':data.status==='coverage_gap'?'Coverage gap':'Response unverified';$('status').className=data.status==='completed'?'':'error'}
 else $('trace').textContent+=JSON.stringify({event:type,data},null,2)+'\n'}
$('stop').onclick=()=>controller?.abort();
$('research').onsubmit=async e=>{e.preventDefault();controller=new AbortController();$('answer').replaceChildren();$('sources').replaceChildren();$('trace').textContent='';$('ask').disabled=true;$('stop').disabled=false;$('status').className='';$('status').textContent='Researching…';
 try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:$('question').value,companies:selected('company'),years:selected('year').map(Number)}),signal:controller.signal});
 if(!response.ok)throw Error('Request rejected: '+response.status);const reader=response.body.getReader(),decoder=new TextDecoder();let pending='';
 while(true){const {value,done}=await reader.read();if(done)break;pending+=decoder.decode(value,{stream:true});let end;
 while((end=pending.indexOf('\n\n'))>=0){const frame=pending.slice(0,end);pending=pending.slice(end+2);const lines=frame.split('\n');const type=lines.find(l=>l.startsWith('event: '))?.slice(7);const payload=lines.filter(l=>l.startsWith('data: ')).map(l=>l.slice(6)).join('\n');if(type&&payload)event(type,JSON.parse(payload))}}}
 catch(error){$('status').textContent=error.name==='AbortError'?'Stopped':error.message;$('status').className='error'}
 finally{$('ask').disabled=false;$('stop').disabled=true;controller=null}};
</script></body></html>

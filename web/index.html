<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Public-Company Research</title>
    <script>
      // Set the theme before first paint: saved choice, else the system setting.
      (() => {
        let theme;
        try { theme = localStorage.getItem("theme"); } catch {}
        document.documentElement.dataset.theme = theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f4f2;
        --text: #263331;
        --muted: #64716b;
        --muted-2: #52645c;
        --soft-text: #46524d;
        --surface: white;
        --field: #fafbf9;
        --inset: #f5f7f3;
        --hover: #f1f4ef;
        --border: #dce2dc;
        --border-strong: #c6d0c8;
        --divider: #e6eae5;
        --primary: #244e42;
        --primary-text: #244e42;
        --link: #245e64;
        --focus: #558f80;
        --code-bg: #f1f3f6;
        --quote-border: #aab3c0;
        --quote: #4c5768;
        --source-bg: #edf3fb;
        --source-text: #174a8b;
        --error: #a62323;
        --warn: #7a5a12;
        --ok: #2c6a3f;
        --removed: #7a3b3b;
        --mark: #fff2ac;
        --selected-bg: #e1ede5;
        --selected-text: #234a3e;
        --ok-border: #b9d3c1;
        --ok-bg: #f2f8f3;
        --warn-border: #e6cf98;
        --warn-bg: #fdf8ec;
        --bad-border: #e2b4b4;
        --bad-bg: #fdf4f4;
        --warn-chip: #f3e6c4;
        --warn-chip-text: #6b4e0c;
        --removed-chip: #f5dddd;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #000000;
        --text: #e6e8ec;
        --muted: #8f949c;
        --muted-2: #a3a8b0;
        --soft-text: #c2c6cc;
        --surface: #0a0b0d;
        --field: #050607;
        --inset: #101114;
        --hover: #16181c;
        --border: #1f2226;
        --border-strong: #2e3238;
        --divider: #17191d;
        --primary: #2c3a52;
        --primary-text: #b4c4dc;
        --link: #9fb6dc;
        --focus: #6b84ad;
        --code-bg: #141619;
        --quote-border: #3a3e45;
        --quote: #aeb2b9;
        --source-bg: #11141a;
        --source-text: #b4c4dc;
        --error: #f08a8a;
        --warn: #e3bf6a;
        --ok: #7fcf96;
        --removed: #e39a9a;
        --mark: #5a4d12;
        --selected-bg: #1d222b;
        --selected-text: #e6e8ec;
        --ok-border: #2f5a3e;
        --ok-bg: #0a120d;
        --warn-border: #6b5622;
        --warn-bg: #14110a;
        --bad-border: #6b3333;
        --bad-bg: #160b0d;
        --warn-chip: #241f10;
        --warn-chip-text: #e3bf6a;
        --removed-chip: #241115;
      }
      /* Agent colors are tuned for white; lighten them for text on dark surfaces. */
      [data-theme="dark"] .agent-name, [data-theme="dark"] .agent-chip, [data-theme="dark"] .step-row { color: color-mix(in srgb, var(--agent) 60%, white); }
      [data-theme="dark"] mark { color: inherit; }
      [data-theme="dark"] #artifacts img { background: white; border-radius: 6px; }
      * {
        box-sizing: border-box;
      }
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      main {
        max-width: 1320px;
        margin: 48px auto;
        padding: 0 32px;
      }
      h1 {
        font-size: clamp(24px, 3vw, 34px);
        letter-spacing: -1px;
        font-weight: 650;
        margin: 0 0 8px;
      }
      p {
        margin-top: 0;
        color: var(--muted);
      }
      form,
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 24px;
        margin: 24px 0;
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 8px;
      }
      select,
      textarea,
      button {
        font: inherit;
        padding: 8px;
        border: 1px solid var(--border-strong);
        border-radius: 7px;
      }
      textarea {
        display: block;
        width: 100%;
        min-height: 88px;
        padding: 14px;
        background: var(--field);
        resize: vertical;
      }
      select {
        width: 100%;
        background: var(--field);
        padding: 5px;
        font-size: 13px;
      }
      .filters {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-bottom: 0;
        grid-column: 2;
        grid-row: 1;
      }
      button {
        cursor: pointer;
        background: var(--primary);
        color: white;
        margin-top: 12px;
        padding: 9px 16px;
        font-size: 14px;
        font-weight: 550;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #stop {
        background: var(--surface);
        color: var(--primary-text);
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
        grid-template-rows: min-content 1fr;
        gap: 24px;
        align-items: start;
      }
      .panel {
        margin: 0;
        min-width: 0;
      }
      h2 {
        font-size: 16px;
        margin-top: 0;
        font-weight: 650;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: inherit;
      }
      #answer {
        overflow-wrap: anywhere;
      }
      #answer > :first-child { margin-top: 0; }
      #answer h1, #answer h2, #answer h3 {
        line-height: 1.3;
        margin: 1.2em 0 0.5em;
      }
      #answer h1 { font-size: 24px; }
      #answer h2 { font-size: 21px; }
      #answer h3 { font-size: 18px; }
      #answer p, #answer ul, #answer ol { margin: 0 0 0.8em; }
      #answer li > p { margin-bottom: 0.3em; }
      #answer p { color: inherit; }
      #answer code {
        font: 0.88em ui-monospace, monospace;
        background: var(--code-bg);
        border-radius: 3px;
        padding: 0.15em 0.3em;
      }
      #answer pre {
        white-space: pre;
        overflow: auto;
        padding: 12px;
        background: var(--code-bg);
        border-radius: 4px;
      }
      #answer pre code { padding: 0; }
      #answer blockquote {
        margin: 1em 0;
        padding-left: 16px;
        border-left: 3px solid var(--quote-border);
        color: var(--quote);
      }
      #answer .table-scroll { margin: 1em 0; }
      #status {
        margin-left: auto;
        font-size: 12px;
        color: var(--muted);
      }
      details {
        margin: 12px 0;
      }
      a {
        color: var(--link);
      }
      .source {
        display: block;
        background: var(--source-bg);
        color: var(--source-text);
        text-align: left;
        width: 100%;
        margin: 8px 0;
      }
      .error {
        color: var(--error);
      }
      #status.error { color: var(--error); }
      #status.notes { color: var(--warn); }
      mark {
        background: var(--mark);
      }
      #passage {
        max-height: 600px;
        overflow: auto;
      }
      #passage pre {
        font: 13px/1.5 monospace;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 8px;
        border-bottom: 1px solid var(--border);
      }
      .table-scroll {
        overflow: auto;
        white-space: normal;
      }
      .calculations { margin: 16px 0; border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
      .calculations > summary { cursor: pointer; font-weight: 650; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .calculations-why { color: var(--muted-2); font-size: 13px; margin: 8px 0; }
      #artifacts img {
        max-width: 100%;
        height: auto;
      }
      #artifacts nav {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        margin: 16px 0;
      }
      [hidden] { display: none !important; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      button:hover:not(:disabled) { filter: brightness(0.95); }
      button:focus-visible, summary:focus-visible, textarea:focus-visible, select:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }
      #examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
      #examples button { background: transparent; border-color: var(--border); color: var(--muted-2); font-size: 12px; padding: 6px 10px; }
      #research { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 28px; }
      .query { grid-column: 1; grid-row: 1; }
      select option { padding: 5px 8px; border-radius: 4px; }
      /* Chrome paints focused selections blue; a background image keeps the same green whether focused or not. */
      select option:checked, select:focus option:checked { background: var(--selected-bg) linear-gradient(var(--selected-bg), var(--selected-bg)); color: var(--selected-text); -webkit-text-fill-color: var(--selected-text); font-weight: 600; }
      .filter-hint { display: block; color: var(--muted); font-size: 10px; margin-top: 6px; }
      .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
      .actions button { margin: 0; }
      #ask { min-width: 112px; }
      .answer-panel { grid-column: 1; grid-row: 1 / span 2; min-height: 220px; }
      #activity-panel { grid-column: 2; grid-row: 1; }
      #source-panel { grid-column: 2; grid-row: 2; }
      .activity-heading { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
      .activity-heading h2 { margin: 0; }
      #agent-elapsed, .agent-duration, .timeline-axis { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
      #agent-activity { list-style: none; margin: 0; padding: 0; }
      #agent-activity li { position: relative; padding-bottom: 6px; }
      #agent-activity li:not(:last-child)::after { content: ""; position: absolute; left: 13px; top: 32px; bottom: 0; border-left: 1px solid var(--border); }
      #agent-activity li:last-child { padding-bottom: 0; }
      .agent-call { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; position: relative; width: 100%; margin: 0; padding: 12px 8px 12px 30px; background: transparent; color: var(--text); border: 1px solid transparent; text-align: left; }
      .agent-call::before { content: ""; position: absolute; left: 9px; top: 17px; width: 8px; height: 8px; background: var(--agent); border-radius: 50%; }
      .agent-call[aria-expanded="true"] { border-color: var(--agent); background: var(--surface); }
      .agent-name { font-size: 13px; font-weight: 600; color: var(--agent); }
      .agent-status { grid-column: 2; grid-row: 1; font-size: 10px; font-weight: 450; color: var(--muted); }
      .agent-duration { grid-column: 3; grid-row: 1; font-size: 11px; min-width: 35px; text-align: right; }
      [data-status="running"] .agent-call { background: var(--surface); border-color: var(--border-strong); box-shadow: 0 2px 8px #26333108; }
      [data-status="running"] .agent-call::before { box-shadow: 0 0 0 4px color-mix(in srgb, var(--agent) 12%, transparent); }
      [data-status="failed"] .agent-status, [data-status="partial"] .agent-status { font-weight: 650; }
      .activity-waiting { color: var(--muted); font-size: 13px; }
      #timeline { margin: 20px 0 0; padding-top: 16px; border-top: 1px solid var(--divider); }
      summary { cursor: pointer; font-size: 12px; color: var(--muted-2); }
      #agent-timeline { margin: 14px 0 6px; }
      .timeline-call { display: grid; grid-template-columns: 42% minmax(0, 1fr); align-items: center; gap: 8px; border: 0; border-radius: 3px; background: transparent; color: var(--muted-2); padding: 5px 0; margin: 0; width: 100%; text-align: left; }
      .timeline-call[aria-expanded="true"] { background: var(--hover); }
      .timeline-name { font-size: 10px; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; }
      .timeline-track { position: relative; height: 12px; border-left: 1px solid var(--border); border-right: 1px solid var(--border); background: var(--inset); }
      .timeline-bar { position: absolute; height: 100%; min-width: 2px; max-width: 100%; border-radius: 2px; background: var(--agent); }
      .timeline-axis { display: flex; justify-content: space-between; margin-left: 44%; font-size: 10px; }
      #agent-details { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--divider); font-size: 12px; overflow-wrap: anywhere; }
      #agent-details h3 { margin: 0 0 8px; font-size: 13px; }
      #agent-details p { margin-bottom: 8px; }
      #agent-details ul { padding-left: 18px; color: var(--muted); }
      .activity-source { background: var(--surface); color: var(--link); border-color: var(--border); font-size: 12px; padding: 4px 8px; margin: 4px 5px 0 0; }
      .agent-chip { margin: 0; padding: 2px 8px; font-size: 11px; font-weight: 600; background: var(--surface); color: var(--agent); border: 1px solid color-mix(in srgb, var(--agent) 45%, var(--surface)); border-radius: 999px; }
      .agent-chip:disabled { opacity: 1; cursor: default; }
      #request-plan { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 18px; background: var(--field); font-size: 13px; }
      #request-plan h3 { margin: 0 0 4px; font-size: 14px; }
      #request-plan p { margin: 0 0 4px; }
      .plan-route, .plan-reason { color: var(--muted-2); font-size: 12px; overflow-wrap: anywhere; }
      .plan-parts { list-style: none; padding: 0; margin: 12px 0 0; }
      .plan-parts > li { padding: 8px 0; border-top: 1px solid var(--divider); }
      .plan-parts details { margin: 4px 0 0 28px; }
      .plan-parts details p { color: var(--muted-2); font-size: 12px; }
      .part-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      .part-number { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--divider); font-size: 11px; font-weight: 650; }
      .part-title { font-weight: 600; }
      .part-status { margin-left: auto; font-size: 11px; color: var(--muted-2); }
      .part-status[data-state="running"] { color: var(--link); font-weight: 650; }
      .part-status[data-state="checked"] { color: var(--ok); font-weight: 650; }
      .part-status[data-state="gap"] { color: var(--warn); font-weight: 650; }
      .part-gap, .part-report { margin: 4px 0 0 28px !important; font-size: 12px; overflow-wrap: anywhere; }
      .part-gap { color: var(--error); }
      .part-report { color: var(--muted); }
      .plan-steps { margin: 10px 0 0; padding-top: 8px; border-top: 1px solid var(--divider); }
      .plan-steps ol { list-style: none; padding: 0; margin: 8px 0 0; }
      .plan-steps li { border-left: 3px solid var(--agent); padding: 2px 0 6px 10px; margin-bottom: 8px; }
      .plan-steps li[data-state="queued"] { border-left-style: dashed; opacity: 0.75; }
      .step-row { display: flex; width: 100%; justify-content: space-between; gap: 8px; margin: 0; padding: 0; background: none; color: var(--agent); border: 0; font-weight: 650; font-size: 13px; text-align: left; }
      .step-state { color: var(--muted-2); font-weight: 450; font-size: 11px; }
      .step-meta { color: var(--muted-2); font-size: 12px; overflow-wrap: anywhere; }
      .step-now { color: var(--link); font-size: 12px; font-weight: 600; overflow-wrap: anywhere; }
      .answer-section { border-left: 3px solid var(--agent); padding: 0 0 4px 14px; margin: 0 0 20px; }
      .answer-section header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 6px; }
      .answer-section h3 { margin: 0; font-size: 15px; }
      .section-badge { margin-left: auto; font-size: 11px; color: var(--muted); }
      .answer-section[data-state="drafting"] .section-badge, .answer-section[data-state="checking"] .section-badge { color: var(--link); font-weight: 600; }
      .answer-section[data-state="checked"] .section-badge { color: var(--ok); font-weight: 600; }
      .answer-section[data-state="failed"] .section-badge { color: var(--error); font-weight: 600; }
      .answer-section:not([data-state="checked"]) .section-body { color: var(--soft-text); }
      .section-waiting { color: var(--muted); font-style: italic; }
      .section-note { font-size: 12px; color: var(--muted-2); margin: 0 0 6px; }
      .section-removed { font-size: 12px; }
      .section-removed del { color: var(--removed); }
      .final-summary { border: 1px solid var(--ok-border); background: var(--ok-bg); border-radius: 10px; padding: 12px 16px; margin: 0 0 18px; font-size: 13px; }
      .final-summary[data-state="partial"] { border-color: var(--warn-border); background: var(--warn-bg); }
      .final-summary[data-state="unreviewed"] { border-color: var(--bad-border); background: var(--bad-bg); }
      .final-summary h3 { margin: 0 0 4px; font-size: 15px; color: var(--ok); }
      .final-summary[data-state="partial"] h3 { color: var(--warn); }
      .final-summary[data-state="unreviewed"] h3 { color: var(--error); }
      #answer .final-summary p { margin: 0 0 6px; }
      .final-gaps { margin: 6px 0 0; padding-left: 18px; }
      .final-gaps li { margin-bottom: 6px; }
      .gap-row { margin: 4px 0 8px; }
      .final-tip, .plan-tip { color: var(--link) !important; font-weight: 600; }
      .gap-kind { display: inline-block; margin-bottom: 2px; padding: 1px 8px; border-radius: 999px; background: var(--warn-chip); color: var(--warn-chip-text); font-size: 11px; font-weight: 650; }
      .gap-row[data-kind="removed"] .gap-kind { background: var(--removed-chip); color: var(--removed); }
      .gap-row[data-kind="scope"] .gap-kind { background: var(--divider); color: var(--soft-text); }
      .gap-why { display: block; color: var(--muted); font-size: 12px; }
      .gap-text { display: block; overflow-wrap: anywhere; }
      #intermediate-drafts ol { list-style: none; padding: 0; }
      #trace { list-style: none; padding: 0; margin: 8px 0 0; font: 12px/1.45 ui-monospace, monospace; max-height: 360px; overflow: auto; }
      #trace li { border-bottom: 1px solid var(--divider); }
      #trace details { margin: 0; }
      #trace summary { padding: 3px 0; font: inherit; color: var(--text); overflow-wrap: anywhere; }
      #trace pre { margin: 4px 0 8px; padding: 8px; background: var(--inset); border-radius: 4px; }
      .trace-time { color: var(--muted); margin-right: 6px; }
      .trace-agent { font-weight: 650; }
      .masthead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      #theme-toggle { margin: 4px 0 0; flex: none; background: var(--surface); color: var(--primary-text); font-size: 12px; padding: 5px 12px; }
      #trace-download { background: var(--surface); color: var(--primary-text); font-size: 12px; padding: 4px 10px; margin: 4px 0 0; }
      @media (max-width: 800px) {
        main { margin: 24px auto; padding: 0 16px; }
        form, .panel { padding: 18px; }
        .layout {
          grid-template-columns: 1fr;
        }
        #activity-panel, #source-panel, .answer-panel { grid-column: 1; grid-row: auto; }
        #research { grid-template-columns: 1fr; gap: 20px; }
        .filters { grid-column: 1; grid-row: 1; }
        .query { grid-column: 1; grid-row: 2; }
        .actions #status { margin-left: 0; flex-basis: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="masthead"><h1>Public-Company Research</h1
        ><button id="theme-toggle" type="button" aria-pressed="false">Dark mode</button></div>
      <p>
        Filings, financials and current developments.
      </p>
      <form id="research">
        <div class="filters">
          <div>
            <label for="company">Companies</label>
            <select id="company" multiple size="4">
              <option value="NVDA" selected>NVIDIA</option>
              <option value="AMD">AMD</option>
              <option value="INTC">Intel</option>
              <option value="QCOM">Qualcomm</option>
            </select>
            <small class="filter-hint">Ctrl/Cmd for multiple</small>
          </div>
          <div>
            <label for="year">Fiscal years (up to two)</label
            ><select id="year" multiple size="3"></select
            ><small id="coverage" class="sr-only"></small>
          </div>
        </div>
        <p id="selection" class="sr-only" aria-live="polite"></p>
        <div class="query">
        <label for="question">Research question</label
        ><textarea id="question" required minlength="3" maxlength="2000">
What has happened at the selected companies since their latest filings? Cite dated sources.</textarea
        >
        <div id="examples" aria-label="Research examples">
          <button type="button" data-question="What has happened at the selected companies since their latest filings? Cite dated sources.">Current developments</button>
          <button type="button" data-question="Is the export-control risk in the latest annual filing still current? Check for an official update.">Check an official update</button>
          <button type="button" data-question="What can this system do, and what does each agent do?">System capabilities</button>
        </div>
        <div class="actions"><button id="ask" type="submit">Research</button>
        <button id="stop" type="button" disabled>Stop</button
        ><span id="status" role="status">Ready</span></div>
        <div id="scope-help" role="alert"></div>
        </div>
      </form>
      <div class="layout">
        <section class="panel" id="activity-panel" hidden aria-label="Agent activity">
          <div class="activity-heading"><h2>Activity</h2><span id="agent-elapsed"></span></div>
          <span id="agent-announcement" class="sr-only" role="status"></span>
          <ol id="agent-activity"></ol>
          <details id="timeline">
            <summary>Timeline</summary>
            <div id="agent-timeline" aria-label="Agent timeline"></div>
            <div class="timeline-axis"><span>0s</span><span id="timeline-end"></span></div>
          </details>
          <div id="agent-details" hidden></div>
        </section>
        <section class="panel answer-panel">
          <h2>Answer</h2>
          <section id="request-plan" hidden aria-label="Request plan"></section>
          <ul id="request-coverage" hidden aria-label="Requested outputs"></ul>
          <div id="answer" aria-live="polite"></div>
          <details id="intermediate-drafts" hidden><summary>Intermediate drafts</summary><ol></ol></details>
          <div id="sources"></div>
          <div id="artifacts"></div>
          <details>
            <summary>Routing and tool trace</summary>
            <button id="trace-download" type="button">Download raw trace (JSON)</button>
            <ol id="trace" aria-label="Trace events"></ol>
          </details>
        </section>
        <aside class="panel" id="source-panel">
          <h2>Source passage</h2>
          <p id="source-label">
            Select a citation to inspect its exact passage.
          </p>
          <div id="passage"></div>
        </aside>
      </div>
    </main>
    <script src="/static/vendor/marked.umd.js"></script>
    <script src="/static/vendor/purify.min.js"></script>
    <script src="/static/agent-activity.js"></script>
    <script src="/static/request-progress.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      let coverage = {},
        controller;
      let answerMarkdown = "", answerSources = [], renderFrame;
      const activity = new AgentActivity((source) => inspect(source));
      const progress = new RequestProgress({
        render: (container, markdown) => renderMarkdown(container, markdown),
        selectCall: (id) => {
          if (activity.selected !== id) activity.select(id);
          $("activity-panel").scrollIntoView({ block: "nearest", behavior: "smooth" });
        },
        colors: AgentActivity.colors,
      });
      const traceLog = new TraceLog(() => activity.now(), () => activity.calls.get(activity.active)?.agent);
      marked.use({ renderer: { html: () => "" } });
      function renderAnswer() {
        cancelAnimationFrame(renderFrame);
        renderFrame = null;
        if (progress.active) return progress.rerender();
        renderMarkdown($("answer"), answerMarkdown);
      }
      function renderMarkdown(container, markdown) {
        container.innerHTML = DOMPurify.sanitize(marked.parse(markdown), {
          USE_PROFILES: { html: true },
          FORBID_TAGS: ["img", "input", "form", "button", "style"],
          FORBID_ATTR: ["style", "id", "name"],
        });
        // Resolve citations through the trusted source registry, including labels
        // that Markdown interpreted as ordinary links or reference definitions.
        for (const link of container.querySelectorAll("a")) {
          const id = link.textContent.replace(/^\[|\]$/g, "");
          const source = answerSources.find((source) => source.source_id === id);
          if (source) {
            link.textContent = `[${id}]`;
            link.href = source.inspection_url || "#";
            link.onclick = (event) => { event.preventDefault(); inspect(source); };
          } else if (link.hasAttribute("href")) {
            try {
              const url = new URL(link.getAttribute("href"), location.href);
              if (!["http:", "https:"].includes(url.protocol)) link.removeAttribute("href");
              else if (url.origin !== location.origin) {
                link.target = "_blank";
                link.rel = "noopener noreferrer";
              }
            } catch { link.removeAttribute("href"); }
          }
        }
        const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
        const nodes = [];
        while (walker.nextNode()) {
          if (!walker.currentNode.parentElement.closest("a, code, pre")) nodes.push(walker.currentNode);
        }
        for (const node of nodes) {
          const fragment = document.createDocumentFragment();
          for (const part of node.textContent.split(/(\[[SFCW]\d+\])/)) {
            const source = answerSources.find((source) => `[${source.source_id}]` === part);
            if (!source) { fragment.append(document.createTextNode(part)); continue; }
            const link = document.createElement("a");
            link.textContent = part;
            link.href = source.inspection_url || "#";
            link.onclick = (event) => { event.preventDefault(); inspect(source); };
            fragment.append(link);
          }
          node.replaceWith(fragment);
        }
        for (const table of container.querySelectorAll("table")) {
          const wrapper = document.createElement("div");
          wrapper.className = "table-scroll";
          table.replaceWith(wrapper);
          wrapper.append(table);
        }
      }
      function scheduleAnswer() {
        if (!renderFrame) renderFrame = requestAnimationFrame(renderAnswer);
      }
      const selected = (id) =>
        Array.from($(id).selectedOptions, (o) => o.value);
      function years(preferred = selected("year")) {
        const companies = selected("company"),
          available = [...new Set(companies.flatMap((c) => coverage[c] || []))]
            .filter((y) =>
              companies.every((c) => (coverage[c] || []).includes(y)),
            )
            .sort();
        $("year").replaceChildren(
          ...available.map((y) => {
            const o = document.createElement("option");
            o.value = y;
            o.textContent = "FY" + y;
            o.selected = preferred.includes(String(y));
            return o;
          }),
        );
        if (!selected("year").length && $("year").options.length)
          $("year").options[$("year").options.length - 1].selected = true;
        $("coverage").textContent = companies
          .map(
            (c) =>
              c + ": " + (coverage[c] || []).map((y) => "FY" + y).join(", "),
          )
          .join(" · ");
        showSelection();
      }
      function showSelection() {
        $("selection").textContent =
          "Selected: " +
          Array.from($("company").selectedOptions, (o) => o.textContent).join(
            ", ",
          ) +
          " · " +
          selected("year")
            .map((y) => "FY" + y)
            .join(", ");
      }
      fetch("/api/coverage")
        .then((r) => r.json())
        .then((data) => {
          coverage = data;
          years();
        })
        .catch(() => {
          $("status").textContent = "Coverage unavailable";
        });
      $("company").addEventListener("change", () => years());
      $("year").addEventListener("change", showSelection);
      for (const button of document.querySelectorAll("[data-question]")) {
        button.addEventListener("click", () => {
          if (controller) return;
          $("question").value = button.dataset.question;
          $("question").focus();
        });
      }
      async function inspect(source) {
        if (!source.inspection_url) {
          $("source-label").textContent = "Explicit assumption or unavailable source";
          const pre = document.createElement("pre");
          pre.textContent = JSON.stringify(source, null, 2);
          $("passage").replaceChildren(pre);
          return;
        }
        const r = await fetch(source.inspection_url);
        if (!r.ok) {
          $("source-label").textContent =
            "Passage unavailable; rebuild the index if sources changed.";
          return;
        }
        const snapshot = await r.json();
        const p = source.kind === "live_source" ? { ...snapshot, ...source } : snapshot;
        if (p.kind === "live_source") {
          $("source-label").textContent = `${p.publisher} · ${p.published_date || "Publication date unavailable"} · ${p.source_tier === "official" ? "Primary source" : "Independent reporting"} · Retrieved ${p.retrieved_at?.slice(0, 10) || "unknown"}${p.date_source ? " · Date from " + p.date_source : ""}`;
          const pre = document.createElement("pre");
          pre.textContent = p.text;
          $("passage").replaceChildren(pre);
          try {
            const url = new URL(p.url);
            if (["http:", "https:"].includes(url.protocol)) {
              const link = document.createElement("a");
              link.href = url.href;
              link.textContent = "Open source";
              link.target = "_blank";
              link.rel = "noopener noreferrer";
              $("source-label").append(document.createTextNode(" · "), link);
            }
          } catch {}
          return;
        }
        if (p.kind === "calculation") {
          $("source-label").textContent =
            `${p.label} · ${p.unit} · ${p.start} → ${p.end}`;
          $("passage").replaceChildren(...readable(p, [
            `${p.label}: ${p.display_value ?? p.value} ${String(p.unit).replaceAll("_", " ")}`,
            p.formula && `Formula: ${p.formula}`,
            `Period: ${p.start} → ${p.end}`,
            "Recomputed independently from the inputs below before it was shown.",
          ]));
          for (const input of p.input_sources) {
            const b = document.createElement("button");
            b.className = "source";
            b.textContent = `Inspect input [${input.source_id}]`;
            b.onclick = () => inspect(input);
            $("passage").append(b);
          }
          return;
        }
        $("source-label").replaceChildren(
          document.createTextNode(
            p.kind === "financial_observation"
              ? `${p.company} · FY${p.fiscal_year} · ${p.metric} · ${p.start} → ${p.end} · ${p.basis} · USD `
              : `${p.company} · FY${p.fiscal_year} · ${p.form} · ${p.period_end} · ${p.version} · ${p.section}${p.page ? " · page " + p.page : ""} `,
          ),
        );
        for (const [label, url] of [
          ["SEC filing", p.canonical_url],
          ["Official retrieval source", p.retrieval_url],
          ["Collected original", p.original_url],
          ["Collected SEC facts", p.snapshot_url],
          ["Filing table passage", p.filing_evidence?.inspection_url],
        ]) {
          if (!url) continue;
          const link = document.createElement("a");
          link.href = url;
          link.textContent = label;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          $("source-label").append(link, document.createTextNode(" · "));
        }
        if (p.kind === "financial_observation") {
          const value = Number(p.value);
          $("passage").replaceChildren(...readable(p, [
            `${p.company} FY${p.fiscal_year} ${String(p.metric).replaceAll("_", " ")}: ${Number.isFinite(value) ? value.toLocaleString("en-US") : p.value} ${p.unit}`,
            `Period: ${p.start} → ${p.end} (${p.period} ${p.basis})`,
            `Source: ${p.form || "SEC filing"}${p.filed ? " filed " + p.filed : ""}${p.accession ? ", accession " + p.accession : ""} · ${p.accounting_basis || ""}`,
          ]));
          return;
        }
        if (p.risk_context_note)
          $("source-label").append(
            document.createTextNode(p.risk_context_note),
          );
        const pre = document.createElement("pre"),
          mark = document.createElement("mark"),
          start = p.start - p.context_start;
        mark.textContent = p.text;
        pre.append(
          document.createTextNode(p.context.slice(0, start)),
          mark,
          document.createTextNode(p.context.slice(start + p.text.length)),
        );
        $("passage").replaceChildren(pre);
      }
      // Plain lines for a figure or calculation, with the raw record kept inspectable.
      function readable(record, lines) {
        const nodes = lines.filter(Boolean).map((line) => {
          const p = document.createElement("p");
          p.textContent = line;
          return p;
        });
        const details = document.createElement("details");
        const summary = document.createElement("summary");
        summary.textContent = "Raw record";
        const pre = document.createElement("pre");
        pre.textContent = JSON.stringify(record, null, 2);
        details.append(summary, pre);
        return [...nodes, details];
      }
      function displaySources(sources) {
        answerSources = sources;
        $("sources").replaceChildren(
          ...sources.map((s) => {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "source";
            b.textContent =
              s.kind === "calculation"
                ? `[${s.source_id}] ${s.label}`
                : s.kind === "financial_observation"
                  ? `[${s.source_id}] ${s.company} FY${s.fiscal_year} ${s.metric} · ${s.period} ${s.basis}`
                  : s.kind === "live_source"
                    ? `[${s.source_id}] ${s.publisher} · ${s.published_date || "Date unavailable"}`
                  : `[${s.source_id}] ${s.company} FY${s.fiscal_year} ${s.form} (${s.version}) · ${s.section}`;
            b.onclick = () => inspect(s);
            return b;
          }),
        );
        renderAnswer();
      }
      function event(type, data) {
        traceLog.add(type, data);
        activity.receive(type, data);
        progress.receive(type, data);
        if (type === "plan" || type === "answer_sections") $("request-coverage").hidden = true;
        if (progress.statusText()) $("status").textContent = progress.statusText();
        if (type === "activity") return;
        if (type === "trace" && data.node === "request_understanding" && !progress.active) {
          $("request-coverage").hidden = false;
          $("request-coverage").replaceChildren(...data.plan.outputs.map((output) => {
            const item = document.createElement("li");
            item.dataset.outputId = output.id;
            item.textContent = "Researching: " + output.description;
            return item;
          }));
        }
        if (type === "trace" && data.node === "answer_coverage") {
          for (const result of data.results) {
            const item = Array.from($("request-coverage").children).find((node) => node.dataset.outputId === result.id);
            if (item) item.textContent = (result.addressed ? "Addressed: " : "Still needed: ") + item.textContent.replace(/^Researching: /, "");
          }
        }
        // The legacy single answer stays current as the sectioned-mode fallback.
        if (type === "token") { answerMarkdown += data; if (!progress.active) scheduleAnswer(); }
        else if (type === "answer") { answerMarkdown = data; if (!progress.active) scheduleAnswer(); }
        else if (type === "sources") displaySources(data);
        else if (type === "scope") {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent =
            "Select " +
            data.suggested_companies
              .map(
                (c) =>
                  Array.from($("company").options).find((o) => o.value === c)
                    ?.textContent || c,
              )
              .join(", ");
          button.onclick = () => {
            const retainedYears = selected("year");
            for (const option of $("company").options)
              option.selected = data.suggested_companies.includes(option.value);
            years(retainedYears);
            $("scope-help").textContent =
              "Selection updated. Submit your question again.";
          };
          $("scope-help").replaceChildren(
            document.createTextNode(data.message + " "),
            button,
          );
        } else if (type === "artifacts") displayArtifacts(data);
        else if (type === "error") {
          $("status").textContent = data;
          $("status").className = "error";
        } else if (type === "complete") {
          progress.unreviewed(answerMarkdown);
          renderAnswer();
          if (data.missing_outputs?.length && !progress.active) {
            const missing = document.createElement("p");
            missing.textContent = "Still needed: " + [...new Set(data.missing_outputs)].join("; ");
            $("scope-help").append(missing);
          }
          if (data.status !== "failed")
            $("status").textContent =
              data.status === "completed"
                ? data.coverage_checked ? "Complete · requested outputs checked" : "Complete"
                : data.status === "coverage_gap"
                  ? "Coverage gap"
                  : data.status === "needs_clarification"
                    ? "Clarification needed"
                  : data.status === "partial"
                    ? "Partial answer · evidence gap"
                    : "Response unverified";
          if (data.status !== "failed" && progress.active) $("status").textContent = progress.summary(data);
          // A finished answer with notes is amber; red is for failures.
          $("status").className = data.status === "completed" ? ""
            : progress.active && ["partial", "coverage_gap"].includes(data.status) ? "notes" : "error";
        }
      }
      function showTheme() {
        const dark = document.documentElement.dataset.theme === "dark";
        $("theme-toggle").textContent = dark ? "Light mode" : "Dark mode";
        $("theme-toggle").setAttribute("aria-pressed", String(dark));
      }
      $("theme-toggle").onclick = () => {
        const theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        try { localStorage.setItem("theme", theme); } catch {}
        showTheme();
      };
      showTheme();
      $("stop").onclick = () => controller?.abort();
      $("research").onsubmit = async (e) => {
        e.preventDefault();
        controller = new AbortController();
        activity.start();
        progress.reset();
        traceLog.reset();
        answerMarkdown = "";
        answerSources = [];
        renderAnswer();
        $("sources").replaceChildren();
        $("artifacts").replaceChildren();
        $("scope-help").replaceChildren();
        $("request-coverage").replaceChildren();
        $("request-coverage").hidden = true;
        $("ask").disabled = true;
        $("stop").disabled = false;
        $("status").className = "";
        $("status").textContent = "Researching…";
        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              question: $("question").value,
              companies: selected("company"),
              years: selected("year").map(Number),
            }),
            signal: controller.signal,
          });
          if (!response.ok) throw Error("Request rejected: " + response.status);
          const reader = response.body.getReader(),
            decoder = new TextDecoder();
          let pending = "";
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            pending += decoder.decode(value, { stream: true });
            let end;
            while ((end = pending.indexOf("\n\n")) >= 0) {
              const frame = pending.slice(0, end);
              pending = pending.slice(end + 2);
              const lines = frame.split("\n");
              const type = lines.find((l) => l.startsWith("event: "))?.slice(7);
              const payload = lines
                .filter((l) => l.startsWith("data: "))
                .map((l) => l.slice(6))
                .join("\n");
              if (type && payload) event(type, JSON.parse(payload));
            }
          }
        } catch (error) {
          activity.finish(error.name === "AbortError" ? "stopped" : "failed");
          $("status").textContent =
            error.name === "AbortError" ? "Stopped" : error.message;
          $("status").className = "error";
        } finally {
          activity.finish("unverified");
          $("ask").disabled = false;
          $("stop").disabled = true;
          controller = null;
        }
      };
      // Quant's checked results arrive when that step ends, often before the answer;
      // keep them collapsed and say who made them and how the answer uses them.
      function displayArtifacts(data) {
        const box = document.createElement("details");
        box.className = "calculations";
        const title = document.createElement("summary");
        title.append(
          `Calculation details (${data.calculations.length}) `,
          progress.chip("Financial Analysis / Quant"),
        );
        const why = document.createElement("p");
        why.className = "calculations-why";
        why.textContent =
          "Every number the Financial Analysis / Quant agent calculated. Each was recomputed independently from the reported SEC figures before use; the answer cites them as " +
          data.calculations.map((row) => row.source_id).join(", ") +
          ". Download the table, chart, code or step-by-step ledger to check them yourself.";
        const table = document.createElement("table"),
          head = document.createElement("tr");
        for (const label of ["Calculation", "Value", "Unit", "Fiscal dates"]) {
          const cell = document.createElement("th");
          cell.textContent = label;
          head.append(cell);
        }
        table.append(head);
        for (const row of data.calculations) {
          const tr = document.createElement("tr");
          const value = Number(row.display_value);
          for (const text of [
            row.label,
            // Percentages read like the answer; the exact value stays in the ledger.
            /percent/.test(row.unit) && Number.isFinite(value) ? value.toFixed(2) : row.display_value,
            row.unit.replaceAll("_", " "),
            `${row.start} → ${row.end}`,
          ]) {
            const td = document.createElement("td");
            td.textContent = text;
            tr.append(td);
          }
          const a = document.createElement("a");
          a.textContent = ` [${row.source_id}]`;
          a.href = row.inspection_url;
          a.onclick = (e) => {
            e.preventDefault();
            inspect(row);
          };
          tr.children[0].append(a);
          table.append(tr);
        }
        const wrapper = document.createElement("div");
        wrapper.className = "table-scroll";
        wrapper.append(table);
        const nav = document.createElement("nav");
        for (const item of data.downloads) {
          const a = document.createElement("a");
          a.href = item.url;
          a.textContent = item.name;
          a.download = item.name;
          nav.append(a);
        }
        const chart = data.downloads.find((d) => d.name === "PNG chart"),
          img = document.createElement("img");
        img.alt =
          "Verified financial calculations; values and units appear in the table.";
        if (chart) img.src = chart.url;
        box.append(title, why, wrapper, nav);
        if (chart) box.append(img);
        $("artifacts").replaceChildren(box);
      }
    </script>
  </body>
</html>

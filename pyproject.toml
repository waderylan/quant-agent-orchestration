[project]
name = "public-company-research-assistant"
version = "0.1.0"
description = "CSCI 599 HW2 local company research, source-linked financial data, and bounded analysis"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anyio==4.15.1",
    "beautifulsoup4==4.15.0",
    "chromadb==1.5.9",
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "langchain-core==1.6.10",
    "langgraph==1.2.15",
    "matplotlib==3.11.2",
    "pydantic==2.14.1",
    "pypdf==6.19.0",
    "python-dotenv==1.2.4",
    "tokenizers==0.23.3",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "playwright==1.64.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]
